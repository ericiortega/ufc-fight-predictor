[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ufc-model"
version = "0.1.0"
description = "End-to-end UFC fight outcome prediction research project (not betting advice)."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.14"
# Exact pins for reproducibility; requirements.txt mirrors these.
dependencies = [
    "beautifulsoup4==4.15.0",
    "duckdb==2.0.0",
    "lxml==6.1.3",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "pydantic==2.14.3",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["data: needs the local DuckDB built from real data (skipped if absent)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# HTML/CSV fixtures mirror real source lines.
"tests/*" = ["E501"]
